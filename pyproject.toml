# pyproject.toml
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports/vars, undefined names)
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern syntax)
    "B",      # flake8-bugbear (common bug patterns)
    "SIM",    # flake8-simplify
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long — let formatter handle it, don't fight the linter over prose-y variable names
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # unused vars ok in test scratch code

[tool.ruff.format]
quote-style = "double"
indent-style = "space"